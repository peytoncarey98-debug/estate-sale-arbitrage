# Render.com blueprint — deploys the app straight from this repo.
# In Render: New → Blueprint → connect this repo. It reads this file.
services:
  - type: web
    name: lot-scout
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120 --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY          # session signing — auto-generated, no action needed
        generateValue: true
      - key: APP_PASSWORD        # the shared password to reach the site — set this
        sync: false
      - key: EBAY_CLIENT_ID      # free eBay App ID — set to turn on value estimates
        sync: false
      - key: EBAY_CLIENT_SECRET  # free eBay Cert ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
