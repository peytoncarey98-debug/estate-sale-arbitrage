# Copy this file to config.yaml and edit it.
# config.yaml is gitignored and never committed.

# Keywords to hunt for on HiBid. Each becomes its own search.
watchlist:
  - roseville pottery
  - hummel figurine
  - griswold cast iron
  - vintage pyrex
  - sterling silver flatware

# How many HiBid result pages to scan per keyword (~100 lots per page)
hibid_pages_per_keyword: 1

# Only include lots at or below this current bid (arbitrage = still cheap).
# Set to null for no cap.
max_current_bid: 50

# Cap how many lots per keyword appear in the email.
max_lots_per_keyword: 15

# Order lots within each keyword: ending_soon | lowest_bid | fewest_bids
sort_by: ending_soon

email:
  to: "peyton.carey98@gmail.com"
  subject_prefix: "[Estate Watch]"
