<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot Scout — sign in</title>
<style>
  :root{
    --ink:#221E1A; --ink-soft:#5a524a; --paper:#EDEAE3; --surface:#FBFAF7;
    --line:#DAD5CB; --burgundy:#803033; --burgundy-deep:#642528; --brass:#9A7A2E;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);
    color:var(--ink);font-family:var(--ui);padding:24px}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 30px rgba(34,30,26,.08);padding:30px 28px;width:100%;max-width:360px}
  .mark{font-family:var(--serif);font-size:26px;font-weight:700}
  .mark .amp{color:var(--burgundy)}
  p{color:var(--ink-soft);font-size:14px;margin:6px 0 20px}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin-bottom:6px}
  input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink)}
  input:focus{outline:2px solid var(--burgundy);outline-offset:1px;border-color:var(--burgundy)}
  button{width:100%;margin-top:16px;background:var(--burgundy);color:#fff;border:0;
    border-radius:10px;padding:12px;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  button:hover{background:var(--burgundy-deep)}
  .err{color:var(--burgundy);font-size:13px;margin-top:12px}
</style>
</head>
<body>
  <form class="box" method="post" action="{{ url_for('do_login') }}">
    <div class="mark">Lot&nbsp;Scout</div>
    <p>Enter the shared password to continue.</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
